<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar • Versão Saúde</title>
  <link rel="stylesheet" href="./assets/css/main.css">
  <link rel="icon" href="./assets/img/favicon.png">
</head>
<body class="vs-body">
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <header class="vs-header">
    <div class="container">
      <div class="brand_login">
        <img src="./assets/img/icon.png" alt="" class="logo" aria-hidden="true">
        <span class="brand-name">Versão Saúde</span>
      </div>
    </div>
  </header>

  <main id="conteudo" class="vs-main">
    <div class="container_login">
      <section class="card_login" aria-labelledby="h1">
        <h1 id="h1" class="h1">Acessar conta</h1>
        <p class="text-muted">Entre com seu e‑mail e senha cadastrados.</p>

        <form id="formLogin" class="grid" novalidate>
          <div>
            <label for="email">E‑mail</label><br>
            <input id="email" name="email" type="email" required autocomplete="username" />
          </div>
          <div>
            <label for="pass">Senha</label><br>
            <input id="pass" name="pass" type="password" required autocomplete="current-password" />
          </div>

          <div class="status-row">
            <span class="badge">Status</span>
            <span id="status" class="status">Aguardando…</span>
          </div>

          <div class="actions">
            <button class="btn btn-primary" type="submit">Entrar</button>
            <a class="btn" href="index.html">Cancelar</a>
          </div>
        </form>
      </section>
    </div>
  </main>

  <footer class="vs-footer">
    <div class="container"><small>© <span id="y"></span> Versão Saúde</small></div>
  </footer>
  <script type="module" src="./js/app.config.js"></script>
  <script type="module" src="./js/pages/login.js"></script>
  <script type="module" src="./js/app.auth.js"></script>
</body>
</html>
