<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contratos • Versão Saúde</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="icon" href="./assets/img/favicon.png">
</head>
<body class="vs-body">
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <header class="vs-header">
    <div class="container">
      <a href="./index.html" class="brand">
          <img src="./assets/img/icon.png" alt="" class="logo" aria-hidden="true">
          <span class="brand-name">Versão Saúde</span>
      </a>

      <nav class="vs-nav" aria-label="Principal">
        <a href="./calendario.html">Calendário</a>
        <a href="./preferencias.html">Preferências</a>
      </nav>
      <div class="actions">
        <button id="btnLogout" class="btn btn-ghost">Sair</button>
      </div>
    </div>
  </header>

  <main id="conteudo" class="vs-main">
    <div class="container">
      <section class="card" aria-labelledby="h1">
        <h1 id="h1" class="h1">Novo contrato (recorrência semanal)</h1>
        <p class="text-muted">Marque os dias/horários (pode sobrepor). Conflitos serão apenas sinalizados.</p>

        <form id="formContrato" class="grid" novalidate>
          <div>
            <label for="profId">Profissional</label><br>
            <input id="profId" name="profId" placeholder="ID ou nome do profissional" required>
          </div>

          <div>
            <label for="roomId">Sala</label><br>
            <input id="roomId" name="roomId" placeholder="ID da sala" required>
          </div>

          <div>
            <label for="startDate">Início do contrato</label><br>
            <input id="startDate" name="startDate" type="date" required>
          </div>

          <div>
            <label for="endDate">Fim do contrato</label><br>
            <input id="endDate" name="endDate" type="date" required>
          </div>

          <div class="status-row">
            <span class="badge">Recorrência</span>
            <span class="status">Seg — Dom, intervalos de 30 min</span>
          </div>

          <!-- Grade semanal -->
          <div id="grid" class="grid-wrapper" aria-label="Grade semanal de seleção"></div>

          <div class="status-row">
            <span class="badge">Status</span>
            <span id="status" class="status">Preencha e selecione os horários.</span>
          </div>

          <div class="actions">
            <button type="button" id="btnPreview" class="btn">Pré‑visualizar conflitos</button>
            <button type="submit" id="btnSalvar" class="btn btn-primary">Salvar contrato</button>
          </div>
        </form>
      </section>
    </div>
  </main>

  <footer class="vs-footer">
    <div class="container">
      <small>© <span id="y"></span> Versão Saúde</small>
    </div>
  </footer>
  <script type="module">
    import { requireAuth, requireRole } from './js/app.auth.js';
    await requireAuth({ redirectTo: './login.html' });
    // await requireRole('gestor', { onFail: 'redirect', redirectTo: '/' });
  </script>
  <script type="module" src="js/app.config.js"></script>
  <script type="module" src="js/app.auth.js"></script>
  <script type="module" src="js/ui/calendar-grid.js"></script>
  <script type="module" src="js/pages/contratos.js"></script>
</body>
</html>
